:root {
  --magenta: #b0126f; --magenta-dark: #8a0d57; --magenta-soft: #fbe6f1;
  --ink: #1f2430; --muted: #646b78; --line: #e7e1ea; --bg: #faf7fb; --card: #ffffff;
  --ok: #23874b; --ok-soft: #dcf3e5; --warn: #c9610f; --warn-soft: #fde8d5;
  --who: #f6a75c; --doing: #ffd84d; --what: #8fcf7f; --where: #80b6ea; --when: #7fd3c8;
  --describe: #c6a8ec; --how: #f6a8c9; --joining: #cfcfcf; --stop: #e9e6ec;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Sassoon Primary", "Comic Sans MS", system-ui, sans-serif;
  font-size: 22px; line-height: 1.35; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--magenta); color: #fff; min-height: 64px; }
header h1 { margin: 0; font-size: 26px; font-weight: normal; flex: 0 0 auto; }
#whoBox { display: none; align-items: center; gap: 8px; }
#who { background: #fff; color: var(--magenta); border-radius: 999px; padding: 6px 18px; font-size: 26px; }
#notMe { border: 2px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 17px; }
#dots { display: flex; gap: 6px; margin-left: auto; }
#dots span { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.35); }
#dots span.done { background: #fff; }
#dots span.now { background: #ffd84d; }
#sbBtn { display: none; border: 2px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 18px; }
#sbBtn.on { background: #fff; color: var(--magenta); }
main { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 22px; margin-bottom: 18px; }
.center { text-align: center; }
.muted { color: var(--muted); }
h2 { font-size: 30px; font-weight: normal; margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.nameTile { border: 3px solid var(--line); background: #fff; border-radius: 22px; padding: 22px 10px; font-size: 30px; }
.nameTile:active, .picTile:active { transform: scale(.97); }
.picTile { border: 3px solid var(--line); background: #fff; border-radius: 22px; padding: 18px 0; font-size: 64px; line-height: 1; }
.big { border: 0; background: var(--magenta); color: #fff; border-radius: 18px; padding: 16px 32px; font-size: 28px;
  box-shadow: 0 4px 0 var(--magenta-dark); }
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--magenta-dark); }
.big:disabled { background: #cdbfc8; box-shadow: none; }
.big.alt { background: #fff; color: var(--magenta); border: 3px solid var(--magenta); box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
.steps { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 10px 0 4px; }
.step { display: flex; align-items: center; gap: 10px; background: var(--magenta-soft); border-radius: 16px; padding: 10px 16px; font-size: 21px; }
.step b { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--magenta); color: #fff; font-weight: normal; }
.roundCards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 16px 0; }
.roundCard { border: 2px solid var(--line); border-radius: 18px; padding: 16px; text-align: center; background: #fff; }
.roundCard .em { font-size: 46px; }
.prompt { font-size: 28px; text-align: center; margin: 4px 0 14px; }
.pic { font-size: 96px; line-height: 1.1; text-align: center; margin: 6px 0; }
.show { font-size: 34px; text-align: center; margin: 12px 0 18px; line-height: 1.6; }
.blank { display: inline-block; min-width: 90px; border-bottom: 4px solid var(--magenta); margin: 0 4px; }
.gblank { display: inline-block; min-width: 60px; border-bottom: 4px solid var(--magenta); margin: 0 2px; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }

.r-who { background: var(--who); } .r-doing { background: var(--doing); } .r-what { background: var(--what); }
.r-where { background: var(--where); } .r-when { background: var(--when); } .r-describe { background: var(--describe); }
.r-how { background: var(--how); } .r-joining { background: var(--joining); } .r-stop { background: var(--stop); min-width: 64px; font-size: 34px; }
.r-letter { background: #fff; border: 3px solid var(--line); box-shadow: 0 4px 0 #ddd3df; min-width: 64px; font-size: 34px; }
.answerRow { min-height: 96px; border: 3px dashed #d5c7d0; border-radius: 18px; padding: 12px; display: flex; flex-wrap: wrap; gap: 10px;
  align-items: center; justify-content: center; margin: 10px 0 18px; background: #fff; }
.answerRow.okRow { border-color: var(--ok); border-style: solid; background: var(--ok-soft); }
.pool { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; min-height: 70px; }
.chip { display: inline-block; border-radius: 10px; padding: 2px 10px; margin: 2px; }
/* fix and missing rows */
.fixRow { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; row-gap: 14px; font-size: 32px; margin: 10px 0 6px; }
.fw { border: 0; background: transparent; padding: 6px 4px; border-radius: 10px; font-size: 32px; }
.fw.tappable { background: #f4eef5; }
.fw.capOn { background: #ead9f3; }
.gap { border: 0; width: 38px; height: 54px; border-radius: 12px; background: transparent; position: relative; padding: 0; }
.gap::after { content: ""; position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; margin: -5px 0 0 -5px; border-radius: 50%;
  border: 2px dashed #cbb7c6; }
.gap.on::after { width: 14px; height: 14px; margin: 2px 0 0 -7px; border: 0; background: var(--ink); }
.gap.right::after { background: var(--ok); }
.gap.wrong::after { background: var(--warn); }
.gap.missed::after { border: 3px solid var(--ok); background: transparent; width: 16px; height: 16px; margin: 1px 0 0 -8px; }
.gap.slotPick { width: 46px; }
.gap.slotPick::after { width: 6px; height: 34px; margin: -17px 0 0 -3px; border-radius: 3px; border: 0; background: #e3d6e0; }
.gap.slotPick.right::after { background: var(--ok); width: 8px; }

.capRight { color: var(--ok); }
.capWrong { color: var(--warn); text-decoration: underline; }
.lookWord { font-size: 72px; text-align: center; margin: 20px 0; letter-spacing: 2px; }
.countdown { text-align: center; font-size: 22px; color: var(--muted); }
/* grapheme sound buttons */
.gw { position: relative; display: inline-block; white-space: nowrap; }
body.sb .gw { padding-bottom: 20px; }
.gl { display: inline-block; }
.mk { position: absolute; pointer-events: none; }

.mk.bar { height: 5px; border-radius: 3px; background: var(--ink); bottom: 8px; }

/* scene */
.scene { position: relative; height: 360px; border-radius: 22px; overflow: hidden; margin: 10px 0 18px; }
.scene.ocean { background: linear-gradient(#bfe3ff 0%, #e9f6ff 46%, #4aa3d8 46%, #2b7fb8 100%); }
.scene.monarchy { background: linear-gradient(#c9e6ff 0%, #eef7ff 55%, #8cc66d 55%, #5f9e46 100%); }

.scene .st.new { animation: pop .7s ease-out; }
@keyframes pop { 0% { transform: translate(-50%, -50%) scale(0); } 70% { transform: translate(-50%, -50%) scale(1.3); } 100% { transform: translate(-50%, -50%) scale(1); } }
.sticker { font-size: 110px; text-align: center; animation: pop2 .8s ease-out; }
@keyframes pop2 { 0% { transform: scale(0); } 70% { transform: scale(1.2); } 100% { transform: scale(1); } }
/* adults panel */
#adults { position: fixed; inset: 0; background: rgba(20,10,20,.45); display: none; align-items: center; justify-content: center; z-index: 50; }
#adults.open { display: flex; }

#adults button { font-size: 20px; padding: 10px 16px; border-radius: 12px; border: 2px solid var(--magenta); background: #fff; color: var(--magenta); margin: 4px 4px 4px 0; }

.hint { text-align: center; color: var(--muted); font-size: 20px; margin-top: 10px; }
@media (max-width: 600px) {
  body { font-size: 19px; } .show, .fixRow, .fw { font-size: 26px; } .tile { font-size: 23px; padding: 12px 14px; }
  .opt { font-size: 24px; } .pic { font-size: 72px; } h2 { font-size: 25px; }
}

<body>
<header>
  <h1 id="title">Build it</h1>
  <span id="whoBox"><span id="who"></span><button id="notMe" type="button">Not me</button></span>
  <div id="dots"></div>
  <button id="sbBtn" type="button">Sound buttons</button>
</header>
<main id="app"></main>

<div id="adults">
  <div class="card">
    <h2>Adults</h2>
    <p id="aQueue"></p>
    <div>
      <button id="aSend" type="button">Send saved answers now</button>
      <button id="aTest" type="button">Send a test row</button>
    </div>
    <p>Enquiry words: <select id="aEnq"><option value="auto">Automatic (by date)</option><option value="ocean">Ocean Meets Sky</option><option value="monarchy">Monarchy and Tudor Bristol</option></select></p>
    <div>
      <button id="aHome" type="button">Back to the names</button>
      <button id="aClose" type="button">Close</button>
    </div>
    <p class="muted" id="aMsg"></p>
  </div>
</div>

<script>
/* =====================================================================
   Build it: daily gap-closing activities (Acer learning zone, Y3)
   Answers go to the "Y3 Gap closing - Writing" Google Form.
   Content lists are near the bottom of this script.
   ===================================================================== */

var FORM = {"url": "https://docs.google.com/forms/d/e/1FAIpQLSfd2wpFTiHddxcu52pI0uvcwN118pmC2-yI0fqivDzBekSx3g/formResponse", "fields": {"learner": "entry.1112919729", "session": "entry.226887823", "gap": "entry.1424147765", "activity": "entry.1685389078", "item": "entry.233205300", "first": "entry.107399390", "answer": "entry.562622395", "attempts": "entry.1085294058", "time": "entry.914953259"}};
var ITEMS_PER_ROUND = 6;
var ENQUIRY_SWITCH = '2026-11-23'; // monarchy words from this date

/* ---------------- learners (names must match the Sheet) ---------------- */
var LEARNERS = [
  { name: 'Rocco S',  first: 'Rocco',  pic: '🐬', gaps: ['ROC-1', 'ROC-2', 'ROC-3'] },
  { name: 'Kalani D', first: 'Kalani', pic: '🦋', gaps: ['KAL-1', 'KAL-2', 'KAL-3'] },
  { name: 'Leo W',    first: 'Leo',    pic: '🦁', gaps: ['LEO-1', 'LEO-2', 'LEO-3'] },
  { name: 'Munraj S', first: 'Munraj', pic: '🐢', gaps: ['MUN-1', 'MUN-2', 'MUN-3'] },
  { name: 'Mahsa N',  first: 'Mahsa',  pic: '🌸', gaps: ['MAH-1', 'MAH-2', 'MAH-3'], sound: true }
];

/* ---------------- gaps: child title, emoji and activity mix ---------------- */
var GAPS = {
  'ROC-1': { title: 'Full stop finder', em: '⏺️', mix: [['split', 2], ['sentOrNot', 2], ['build', 2]] },
  'ROC-2': { title: 'Tricky words', em: '⭐', words: ['after', 'said', 'was', 'were', 'they', 'because', 'could', 'water'], mix: [['pickSpell', 3], ['lookBuild', 3]] },
  'ROC-3': { title: 'Sound choices', em: '🔤', mix: [['grapheme', 4], ['suffix', 2]] },
  'KAL-1': { title: 'Full stop finder', em: '⏺️', mix: [['stops3', 2], ['split', 2], ['sentOrNot', 2]] },
  'KAL-2': { title: 'Missing words', em: '🔍', mix: [['missing', 4], ['makesSense', 2]] },
  'KAL-3': { title: 'Tricky words and -ed', em: '⭐', words: ['could', 'there', 'would', 'should', 'were', 'said'], mix: [['pickSpell', 2], ['lookBuild', 2], ['suffix', 2]] },
  'LEO-1': { title: 'Sentence builder', em: '🏗️', mix: [['build', 3], ['makesSense', 3]] },
  'LEO-2': { title: 'Capitals and full stops', em: '🔠', mix: [['fixBoth', 4], ['whichCorrect', 2]] },
  'LEO-3': { title: 'Tricky words', em: '⭐', words: ['said', 'was', 'they', 'have', 'are', 'one', 'what', 'were'], mix: [['pickSpell', 3], ['lookBuild', 3]] },
  'MUN-1': { title: 'Full stop finder', em: '⏺️', mix: [['stops3', 3], ['split', 3]] },
  'MUN-2': { title: 'Tricky words and sounds', em: '⭐', words: ['said', 'what', 'know', 'when', 'there'], mix: [['pickSpell', 2], ['thwh', 4]] },
  'MUN-3': { title: '-ed endings', em: '🔚', mix: [['suffix', 4], ['contraction', 2]] },
  'MAH-1': { title: 'Word and picture', em: '🖼️', mix: [['picToWord', 3], ['wordToPic', 3]] },
  'MAH-2': { title: 'Sentence builder', em: '🏗️', mix: [['mahBuild', 6]] },
  'MAH-3': { title: 'Sound builder', em: '🔤', mix: [['mahSpell', 6]] }
};

/* ---------------- helpers ---------------- */
var STORE = 'gcW1:';
function sget(k, d) { try { var v = localStorage.getItem(STORE + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } }
function sset(k, v) { try { localStorage.setItem(STORE + k, JSON.stringify(v)); } catch (e) {} }
function el(tag, props) {
  var e = document.createElement(tag);
  if (props) Object.keys(props).forEach(function (k) {
    var v = props[k];
    if (k === 'class') e.className = v; else if (k === 'text') e.textContent = v;
    else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
    else if (k === 'style') e.style.cssText = v; else if (k === 'disabled') e.disabled = !!v;
    else e.setAttribute(k, v);
  });

}
function add(e, c) {
  if (c == null || c === false) return;
  if (Array.isArray(c)) { c.forEach(function (x) { add(e, x); }); return; }
  e.appendChild(typeof c === 'string' ? document.createTextNode(c) : c);
}
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function pick(a) { return a[Math.floor(Math.random() * a.length)]; }
function pickN(a, n) { return shuffle(a).slice(0, n); }
function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); }
function enquiry() { var o = sget('enq', 'auto'); if (o !== 'auto') return o; return todayStr() >= ENQUIRY_SWITCH ? 'monarchy' : 'ocean'; }
var app = document.getElementById('app');
function screen() { app.innerHTML = ''; window.scrollTo(0, 0); for (var i = 0; i < arguments.length; i++) add(app, arguments[i]); afterRender(); }
function afterRender() { requestAnimationFrame(function () { drawMarks(app); }); setTimeout(function () { drawMarks(app); }, 400); }

/* ---------------- sending to the Google Form ---------------- */
var MEMQ = [];
function outbox(v) {
  if (v) { try { localStorage.setItem(STORE + 'outbox', JSON.stringify(v)); } catch (e) { MEMQ = v; } return v; }
  try { var s = localStorage.getItem(STORE + 'outbox'); return s ? JSON.parse(s) : MEMQ.slice(); } catch (e) { return MEMQ.slice(); }
}
function postOne(row) {
  var body = new URLSearchParams();
  Object.keys(FORM.fields).forEach(function (k) { body.append(FORM.fields[k], row[k] == null ? '' : String(row[k])); });
  return fetch(FORM.url, { method: 'POST', mode: 'no-cors', body: body });
}
var flushing = false;
function flush() {
  if (flushing) return; var q = outbox(); if (!q.length) return;
  if (navigator.onLine === false) return;
  flushing = true;
  postOne(q[0]).then(function () { var r = outbox(); r.shift(); outbox(r); flushing = false; flush(); })
    .catch(function () { flushing = false; });
}
function queue(row) { var q = outbox(); q.push(row); outbox(q); flush(); }
setInterval(flush, 15000);
window.addEventListener('online', flush);

/* ---------------- grapheme words with sound buttons ---------------- */
// 'l-a_e-k' = lake: graphemes split by '-', a split digraph written a_e
function parseG(ann) {
  var toks = ann.split('-'), letters = [], groups = [], pending = null;
  function put(str, g) { for (var i = 0; i < str.length; i++) { g.push(letters.length); letters.push(str[i]); } }
  toks.forEach(function (t) {
    if (t.indexOf('_') >= 0) { var p = t.split('_'), g = []; put(p[0], g); groups.push(g); if (pending) { put(pending.s, pending.g); } pending = { g: g, s: p[1] }; }
    else { var g2 = []; put(t, g2); groups.push(g2); if (pending) { put(pending.s, pending.g); pending = null; } }
  });
  if (pending) put(pending.s, pending.g);
  return { letters: letters, groups: groups, text: letters.join(''), ann: ann };
}
function gWord(ann) {
  var p = parseG(ann), w = el('span', { class: 'gw' });
  w._g = p; w._ls = p.letters.map(function (c) { var s = el('span', { class: 'gl', text: c }); w.appendChild(s); return s; });
  return w;
}
function drawMarks(root) {
  var on = document.body.classList.contains('sb');
  Array.prototype.forEach.call(root.querySelectorAll('.gw'), function (w) {
    Array.prototype.forEach.call(w.querySelectorAll('.mk'), function (m) { m.parentNode.removeChild(m); });
    if (!on || !w._g) return;
    w._g.groups.forEach(function (g) {
      var a = w._ls[g[0]], b = w._ls[g[g.length - 1]], m;
      var contiguous = g.every(function (v, i) { return i === 0 || v === g[i - 1] + 1; });
      if (g.length === 1) { m = el('span', { class: 'mk dot' }); m.style.left = (a.offsetLeft + a.offsetWidth / 2) + 'px'; }
      else if (contiguous) { m = el('span', { class: 'mk bar' }); m.style.left = (a.offsetLeft + 2) + 'px'; m.style.width = (b.offsetLeft + b.offsetWidth - a.offsetLeft - 4) + 'px'; }
      else { m = el('span', { class: 'mk arc' }); var l = a.offsetLeft + a.offsetWidth / 2; m.style.left = l + 'px'; m.style.width = (b.offsetLeft + b.offsetWidth / 2 - l) + 'px'; }
      w.appendChild(m);
    });
  });
}
window.addEventListener('resize', function () { drawMarks(app); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawMarks(app); });

/* ---------------- state ---------------- */
var S = null; // session
var sbBtn = document.getElementById('sbBtn');
sbBtn.onclick = function () {
  var on = !document.body.classList.contains('sb');
  document.body.classList.toggle('sb', on); sbBtn.classList.toggle('on', on);
  if (S) sset('sb:' + S.learner.name, on);
  drawMarks(app);
};
function setHeader() {
  document.getElementById('who').textContent = S ? S.learner.first : '';
  document.getElementById('whoBox').style.display = S ? 'flex' : 'none';
  sbBtn.style.display = S && S.learner.sound ? 'inline-block' : 'none';
  var dots = document.getElementById('dots'); dots.innerHTML = '';
  if (S && S.stage === 'items') {
    S.round.items.forEach(function (it, i) { dots.appendChild(el('span', { class: i < S.ii ? 'done' : (i === S.ii ? 'now' : '') })); });
  }
}

/* ---------------- screens: names ---------------- */
function home() {
  S = null; setHeader(); document.body.classList.remove('sb'); sbBtn.classList.remove('on');
  screen(el('div', { class: 'card center' },
    el('h2', { text: 'Tap your name' }),
    el('div', { class: 'grid' }, LEARNERS.map(function (l) {
      return el('button', { class: 'nameTile', type: 'button', onclick: function () { start(l); } }, l.first);
    }))));
}

/* ---------------- session plan ---------------- */
function start(l) {
  var sid = l.name.replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() + '-' + todayStr().replace(/-/g, '') + '-' + new Date().toTimeString().slice(0, 5).replace(':', '') + '-' + Math.random().toString(36).slice(2, 5);
  S = { learner: l, session: sid, rounds: [], ri: 0, ii: 0, stage: 'ready', stickers: [] };
  document.body.classList.toggle('sb', !!(l.sound && sget('sb:' + l.name, false)));
  sbBtn.classList.toggle('on', document.body.classList.contains('sb'));
  // warm-up: a quick mixed revisit, one item from each of the learner's gaps (nothing is saved on the iPad)
  S.rounds.push({ gap: null, warm: true, items: shuffle(l.gaps.map(function (g) {
    var m = pick(GAPS[g].mix), it = GEN[m[0]](GAPS[g]); it.gap = g; it.activity = m[0]; it.warm = true; return it;
  })) });
  l.gaps.forEach(function (g) { S.rounds.push({ gap: g, items: makeRound(g) }); });
  setHeader(); ready();
}
function makeRound(gapId) {
  var gap = GAPS[gapId], items = [];
  gap.mix.forEach(function (m) {
    var used = {};
    for (var i = 0; i < m[1]; i++) {
      var it = null, tries = 0;
      while (tries++ < 12) { it = GEN[m[0]](gap); if (!used[it.label]) break; }
      used[it.label] = true; it.gap = gapId; it.activity = m[0]; items.push(it);
    }
  });
  return shuffle(items).slice(0, ITEMS_PER_ROUND);
}
function ready() {
  S.stage = 'ready'; setHeader();
  var cards = S.rounds.map(function (r, i) {
    if (r.warm) return el('div', { class: 'roundCard' }, el('div', { class: 'em', text: '🔁' }), el('div', { text: 'Warm-up' }), el('div', { class: 'muted', text: 'a quick revisit' }));
    var g = GAPS[r.gap]; return el('div', { class: 'roundCard' }, el('div', { class: 'em', text: g.em }), el('div', { text: g.title }));
  });
  screen(el('div', { class: 'card center' },
    el('h2', { text: 'Today you will build and choose' }),
    el('div', { class: 'roundCards' }, cards),
    el('div', { class: 'steps' }, el('div', { class: 'step' }, el('b', { text: '1' }), '👆 Tap to build or choose'), el('div', { class: 'step' }, el('b', { text: '2' }), '✅ Check it')),
    el('div', { class: 'next' }, el('button', { class: 'big', type: 'button', onclick: function () { beginRound(0); } }, 'Start'))));
}
function beginRound(i) {
  S.ri = i; S.ii = 0; S.round = S.rounds[i]; S.stage = 'items'; S.roundFirst = 0; showItem();
}
function showItem() {
  setHeader();
  var it = S.round.items[S.ii];
  var t0 = Date.now();
  ENG[engineOf(it)](it, function (res) {
    queue({ learner: S.learner.name, session: S.session, gap: it.gap, activity: (it.warm ? 'Warm-up: ' : '') + it.activity,
      item: it.label, first: res.first ? 'Correct' : 'Incorrect', answer: res.answer || '', attempts: res.attempts || 1,
      time: new Date().toISOString() });
    if (res.first) S.roundFirst++;
    S.ii++;
    if (S.ii < S.round.items.length) showItem(); else roundDone();
  });
}
function engineOf(it) { return it.engine; }
var STICKERS = { ocean: ['⛵', '🐚', '🦀', '🐟', '🐬', '🐙', '🌞', '☁️', '🐳', '🐧', '🦑', '🏝️', '🐠', '🐡'], monarchy: ['👑', '🏰', '🐴', '🚩', '💎', '🎺', '🛡️', '💰', '🕊️', '🌹', '🎉', '⚜️'] };
function roundDone() {
  var enq = enquiry(), st = pick(STICKERS[enq]); S.stickers.push(st);
  var last = S.ri === S.rounds.length - 1;
  S.stage = 'between'; setHeader();
  screen(el('div', { class: 'card center' },
    el('h2', { text: S.round.warm ? 'Warm-up done!' : 'Round complete!' }),
    el('div', { class: 'sticker', text: st }),
    el('p', { text: 'You earned a sticker for your picture.' }),
    el('div', { class: 'next' }, el('button', { class: 'big', type: 'button', onclick: function () { if (last) finish(); else beginRound(S.ri + 1); } }, last ? 'See my picture' : 'Next round'))));
}
function finish() {
  // today's stickers only, spread across the picture
  var enq = enquiry(), n = S.stickers.length;
  var scene = S.stickers.map(function (e, i) { return { e: e, x: 12 + (76 * (i + 0.5) / n) + (Math.random() * 8 - 4), y: 25 + Math.random() * 50, n: true }; });
  S.stage = 'end'; setHeader();
  var box = el('div', { class: 'scene ' + enq });
  scene.forEach(function (s) { box.appendChild(el('span', { class: 'st' + (s.n ? ' new' : ''), style: 'left:' + s.x + '%;top:' + s.y + '%', text: s.e })); });
  screen(el('div', { class: 'card center' },
    el('h2', { text: 'Brilliant building, ' + S.learner.first + '!' }),
    box,
    el('p', { text: 'Here are the stickers you earned today.' }),
    el('div', { class: 'next' }, el('button', { class: 'big', type: 'button', onclick: home }, 'Finish'))));
  flush();

/* =====================================================================

  build: function () {

/* ---------------- adults panel (press and hold the title) ---------------- */
var adults = document.getElementById('adults'), holdT = null, taps = 0, tapT = null;
var title = document.getElementById('title');
function openAdults() {
  document.getElementById('aQueue').textContent = 'Answers waiting to send on this iPad: ' + outbox().length;
  document.getElementById('aEnq').value = sget('enq', 'auto');
  document.getElementById('aMsg').textContent = 'Enquiry words now: ' + (enquiry() === 'monarchy' ? 'Monarchy and Tudor Bristol' : 'Ocean Meets Sky');
  adults.classList.add('open');
}
title.addEventListener('touchstart', function () { holdT = setTimeout(openAdults, 1200); }, { passive: true });
title.addEventListener('touchend', function () { clearTimeout(holdT); });
title.addEventListener('click', function () { taps++; clearTimeout(tapT); tapT = setTimeout(function () { taps = 0; }, 1500); if (taps >= 5) { taps = 0; openAdults(); } });
document.getElementById('aClose').onclick = function () { adults.classList.remove('open'); };
document.getElementById('aSend').onclick = function () { flushing = false; flush(); setTimeout(openAdults, 1500); };
document.getElementById('aTest').onclick = function () {
  queue({ learner: 'TEST', session: 'TEST-' + Date.now(), gap: 'TEST', activity: 'test', item: 'Test row from an iPad (delete me)', first: 'Correct', answer: '', attempts: 1, time: new Date().toISOString() });
  document.getElementById('aMsg').textContent = 'Test row sent. Check the Writing responses tab.';
};
document.getElementById('aEnq').onchange = function () { sset('enq', this.value); openAdults(); };
document.getElementById('aHome').onclick = function () { adults.classList.remove('open'); home(); };

document.getElementById('notMe').onclick = function () { home(); };
home();
flush();
