:root {
  --magenta: #b0126f; --magenta-dark: #8a0d57; --magenta-soft: #fbe6f1;
  --ink: #1f2430; --muted: #646b78; --line: #e7e1ea; --bg: #faf7fb; --card: #ffffff;
  --ok: #23874b; --ok-soft: #dcf3e5; --warn: #c9610f; --warn-soft: #fde8d5;
  --who: #f6a75c; --doing: #ffd84d; --what: #8fcf7f; --where: #80b6ea; --when: #7fd3c8;
  --describe: #c6a8ec; --how: #f6a8c9; --joining: #cfcfcf; --stop: #e9e6ec;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Sassoon Primary", "Comic Sans MS", system-ui, sans-serif;
  font-size: 22px; line-height: 1.35; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px;
  background: var(--magenta); color: #fff; min-height: 64px; }
header h1 { margin: 0; font-size: 26px; font-weight: normal; flex: 0 0 auto; }
#whoBox { display: none; align-items: center; gap: 8px; }
#who { background: #fff; color: var(--magenta); border-radius: 999px; padding: 6px 18px; font-size: 26px; }
#pend { display: none; background: #ffd84d; color: #1f2430; border-radius: 999px; padding: 4px 12px; font-size: 17px; white-space: nowrap; }
#notMe { border: 2px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 17px; }
#dots { display: flex; gap: 6px; margin-left: auto; }
#dots span { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.35); }
#dots span.done { background: #fff; }
#dots span.now { background: #ffd84d; }
#sbBtn { display: none; border: 2px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 18px; }
#sbBtn.on { background: #fff; color: var(--magenta); }
main { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 22px; margin-bottom: 18px; }
.center { text-align: center; }
.muted { color: var(--muted); }
h2 { font-size: 30px; font-weight: normal; margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.nameTile .ic { display: flex; align-items: center; justify-content: center; height: 86px; font-size: 72px; line-height: 1; margin-bottom: 6px; }
.nameTile .ic svg, #who .ic svg { vertical-align: -0.12em; }
#who .ic { margin-right: 8px; }
.nameTile { border: 3px solid var(--line); background: #fff; border-radius: 22px; padding: 22px 10px; font-size: 30px; }
.nameTile:active, .picTile:active { transform: scale(.97); }
.picTile { border: 3px solid var(--line); background: #fff; border-radius: 22px; padding: 18px 0; font-size: 64px; line-height: 1; }
.big { border: 0; background: var(--magenta); color: #fff; border-radius: 18px; padding: 16px 32px; font-size: 28px;
  box-shadow: 0 4px 0 var(--magenta-dark); }
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--magenta-dark); }
.big:disabled { background: #cdbfc8; box-shadow: none; }
.big.alt { background: #fff; color: var(--magenta); border: 3px solid var(--magenta); box-shadow: none; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: center; }
.steps { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin: 10px 0 4px; }
.step { display: flex; align-items: center; gap: 10px; background: var(--magenta-soft); border-radius: 16px; padding: 10px 16px; font-size: 21px; }
.step b { display: inline-grid; place-items: center; width: 34px; height: 34px; border-radius: 50%; background: var(--magenta); color: #fff; font-weight: normal; }
.roundCards { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; margin: 16px 0; }
.roundCard { border: 2px solid var(--line); border-radius: 18px; padding: 16px; text-align: center; background: #fff; }
.roundCard .em { font-size: 46px; }
.prompt { font-size: 28px; text-align: center; margin: 4px 0 14px; }
.pic { font-size: 96px; line-height: 1.1; text-align: center; margin: 6px 0; }
.show { font-size: 34px; text-align: center; margin: 12px 0 18px; line-height: 1.6; }

.tile.dragging { position: relative; z-index: 5; box-shadow: 0 10px 20px rgba(0,0,0,.25); }
.rowHint { text-align: center; color: var(--muted); font-size: 19px; margin: -10px 0 14px; min-height: 26px; }
.pool { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; min-height: 70px; }

.proofRow .chip { padding: 4px 12px; margin: 0; }

.fw { border: 0; background: transparent; padding: 6px 4px; border-radius: 10px; font-size: 32px; }

.fw.capOn { background: #ead9f3; }
.gap:active { background: var(--magenta-soft); }
.gap { border: 0; width: 50px; height: 62px; border-radius: 12px; background: transparent; position: relative; padding: 0; }

  border: 2px dashed #cbb7c6; }

body.sb .gw { padding-bottom: 20px; }
.gl { display: inline-block; }

var ICON_SVG = { xeme: '<svg viewBox="6 30 92 62" width="1.45em" height="0.98em" aria-hidden="true"><path d="M47 72 L45 90 M57 72 L59 90" stroke="#e0566b" stroke-width="3" stroke-linecap="round"/><path d="M38 56 C42 46 60 44 78 52 L97 50 L90 58 L97 66 L78 66 C62 74 44 72 38 64 Z" fill="#ffffff" stroke="#9aa3ad" stroke-width="1.5"/><path d="M42 54 C54 44 72 46 88 56 L82 62 C70 60 54 60 44 60 Z" fill="#8a96a3"/><path d="M78 54 L94 60 L82 62 Z" fill="#1f2430"/><path d="M36 52 C34 46 40 44 44 50 L46 60 L38 62 Z" fill="#ffffff"/><circle cx="31" cy="42" r="11" fill="#2f3540"/><circle cx="28" cy="40" r="2.2" fill="#ffffff"/><circle cx="28" cy="40" r="1.1" fill="#1f2430"/><path d="M21 42 L8 44.5 L21 47 Z" fill="#1f2430"/><path d="M8 44.5 L12 43.7 L12 45.3 Z" fill="#f5c518"/></svg>', manta: '<svg viewBox="0 0 100 100" width="1em" height="1em" aria-hidden="true"><path d="M50 96 L49 70 L51 70 Z" fill="#1d3557" stroke="#1d3557" stroke-width="2" stroke-linecap="round"/><path d="M50 30 C36 30 18 40 4 54 C20 58 34 61 43 69 L50 74 L57 69 C66 61 80 58 96 54 C82 40 64 30 50 30 Z" fill="#2f5d8a"/><path d="M50 38 C42 38 30 45 20 53 C31 55 40 58 46 64 L50 67 L54 64 C60 58 69 55 80 53 C70 45 58 38 50 38 Z" fill="#4f86b8"/><path d="M44 31 C41 24 43 19 46 21 C47 25 47 28 47 31 Z M56 31 C59 24 57 19 54 21 C53 25 53 28 53 31 Z" fill="#2f5d8a"/><circle cx="43" cy="36" r="2.4" fill="#fff"/><circle cx="57" cy="36" r="2.4" fill="#fff"/></svg>' };

/* ---------------- adults panel (press and hold the title) ---------------- */
var adults = document.getElementById('adults'), holdT = null, taps = 0, tapT = null;
var title = document.getElementById('title');
function openAdults() {
  document.getElementById('aQueue').textContent = 'Answers waiting to send on this iPad: ' + outbox().length;
  document.getElementById('aEnq').value = sget('enq', 'auto');
  var fo = sget('fsStep', null); document.getElementById('aFs').value = fo && fo.d === todayStr() ? String(fo.n) : 'auto';
  document.getElementById('aMsg').textContent = 'Writing ladder now: ' + (fsStepToday() ? 'Step ' + fsStepToday() + ' (' + FS_STEPS[fsStepToday()].title + ')' : 'not started') + '. Enquiry words now: ' + (enquiry() === 'monarchy' ? 'Monarchy and Tudor Bristol' : 'Ocean Meets Sky');
  adults.classList.add('open');
}
title.addEventListener('touchstart', function () { holdT = setTimeout(openAdults, 1200); }, { passive: true });
title.addEventListener('touchend', function () { clearTimeout(holdT); });
title.addEventListener('click', function () { taps++; clearTimeout(tapT); tapT = setTimeout(function () { taps = 0; }, 1500); if (taps >= 5) { taps = 0; openAdults(); } });
document.getElementById('aClose').onclick = function () { adults.classList.remove('open'); };
document.getElementById('aSend').onclick = function () { flushing = false; flush(); setTimeout(openAdults, 1500); };
document.getElementById('aTest').onclick = function () {
  queue({ learner: 'TEST', session: 'TEST-' + Date.now(), gap: 'TEST', activity: 'test', item: 'Test row from an iPad (delete me)', first: 'Correct', answer: '', attempts: 1, time: new Date().toISOString() });
  document.getElementById('aMsg').textContent = 'Test row sent. Check the Writing responses tab.';
};
document.getElementById('aEnq').onchange = function () { sset('enq', this.value); openAdults(); };
document.getElementById('aFs').onchange = function () { sset('fsStep', this.value === 'auto' ? null : { d: todayStr(), n: +this.value }); openAdults(); };
document.getElementById('aHome').onclick = function () { adults.classList.remove('open'); home(); };

document.getElementById('notMe').onclick = function () { home(); };
home();
flush();
</script>
