:root {
  --magenta: #b0126f; --magenta-dark: #8a0d57; --magenta-soft: #fbe6f1;
  --ink: #1f2430; --muted: #646b78; --line: #e7e1ea; --bg: #faf7fb; --card: #ffffff;
  --ok: #23874b; --ok-soft: #dcf3e5; --warn: #c9610f; --warn-soft: #fde8d5;
  --ev: #fff1a8; --tapped: #ffd3e8;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Sassoon Primary", "Comic Sans MS", system-ui, sans-serif;
  font-size: 22px; line-height: 1.4; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--magenta); color: #fff; min-height: 64px; }
header h1 { margin: 0; font-size: 26px; font-weight: normal; }
#whoBox { display: none; align-items: center; gap: 8px; }
#who { background: #fff; color: var(--magenta); border-radius: 999px; padding: 6px 18px; font-size: 26px; }
#pend { display: none; background: #ffd84d; color: #1f2430; border-radius: 999px; padding: 4px 12px; font-size: 17px; white-space: nowrap; }
.split .textCard { position: sticky; top: 70px; z-index: 4; max-height: 44vh; overflow-y: auto; box-shadow: 0 6px 12px rgba(0,0,0,.08); }
@media (min-width: 900px) and (orientation: landscape) {
  .split { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; align-items: start; }
  .split .textCard { top: 82px; max-height: calc(100vh - 100px); }
}
#notMe { border: 2px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 4px 12px; font-size: 17px; }
#dots { display: flex; gap: 6px; margin-left: auto; }
#dots span { width: 14px; height: 14px; border-radius: 50%; background: rgba(255,255,255,.35); }
#dots span.done { background: #fff; } #dots span.now { background: #ffd84d; }
#sbBtn { display: none; border: 2px solid #fff; background: transparent; color: #fff; border-radius: 999px; padding: 6px 14px; font-size: 18px; }
#sbBtn.on { background: #fff; color: var(--magenta); }
main { max-width: 980px; margin: 0 auto; padding: 18px 16px 60px; }
.card { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 22px; margin-bottom: 18px; }
.center { text-align: center; } .muted { color: var(--muted); }
h2 { font-size: 30px; font-weight: normal; margin: 0 0 14px; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.nameTile .ic { display: flex; align-items: center; justify-content: center; height: 86px; font-size: 72px; line-height: 1; margin-bottom: 6px; }
.nameTile .ic svg, #who .ic svg { vertical-align: -0.12em; }
#who .ic { margin-right: 8px; }
.nameTile { border: 3px solid var(--line); background: #fff; border-radius: 22px; padding: 22px 10px; font-size: 30px; }
.picTile { border: 3px solid var(--line); background: #fff; border-radius: 22px; padding: 18px 0; font-size: 64px; line-height: 1; }
.big { border: 0; background: var(--magenta); color: #fff; border-radius: 18px; padding: 16px 32px; font-size: 28px; box-shadow: 0 4px 0 var(--magenta-dark); }
.big:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--magenta-dark); }
.big.alt { background: #fff; color: var(--magenta); border: 3px solid var(--magenta); box-shadow: none; }
.next { margin-top: 18px; text-align: center; display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
.hint { text-align: center; color: var(--muted); font-size: 20px; margin-top: 10px; }
.title { font-size: 24px; color: var(--magenta); margin: 0 0 10px; }
.passage { display: flex; gap: 18px; align-items: flex-start; }
.passage .txt { flex: 1; }
.passage .pic { font-size: 90px; line-height: 1; }
.prev { font-size: 22px; color: var(--muted); margin: 0 0 10px; line-height: 1.5; }
.cur { font-size: 34px; line-height: 1.7; margin: 4px 0; }
body.sb .cur { line-height: 2.2; }
.cur.whole { font-size: 25px; line-height: 1.55; } body.sb .cur.whole { line-height: 2.1; }
@media (max-width: 600px) { .cur.whole { font-size: 21px; } }
.w { display: inline-block; border-radius: 10px; padding: 0 3px; margin: 0 1px; }
.w.tap { background: #f4eef5; }
.w.ev { background: var(--ev); }

<body>
<header>
  <h1 id="title">Reading time</h1>

  <div id="dots"></div>
  <span id="pend"></span>

</header>
<main id="app"></main>

<div id="adults">
  <div class="card">
    <h2>Adults</h2>
    <p id="aQueue"></p>
    <div><button id="aSend" type="button">Send saved answers now</button><button id="aTest" type="button">Send a test row</button></div>
    <p>Passage for today: <select id="aPass"></select></p>
    <div><button id="aHome" type="button">Back to the names</button><button id="aClose" type="button">Close</button></div>
    <p class="muted" id="aMsg"></p>
  </div>
</div>

<script>
/* =====================================================================
   Reading time: 5 linked sentences, one question each (Acer, Y3)

var FORM = {"url": "https://docs.google.com/forms/d/e/1FAIpQLSfNEDVi4GWvFMLLEtS4v3yEiwJ2FCp9cScTZs5tpBQ3qesIAw/formResponse", "fields": {"learner": "entry.1320799495", "session": "entry.1607565800", "passage": "entry.1522486681", "sentence": "entry.2072392593", "qtype": "entry.96304366", "first": "entry.1269369674", "answer": "entry.482270548", "tapped": "entry.196507964", "sound": "entry.1196539554", "seconds": "entry.1525439196", "time": "entry.1561020559"}};

var LEARNERS = [
  { name: 'Rocco S',  first: 'Rhino', icon: '🦏',pic: '🐬' },
  { name: 'Kalani D', first: 'Kangaroo', icon: '🦘',pic: '🦋' },
  { name: 'Leo W',    first: 'F1 car', icon: '🏎️',pic: '🦁' },
  { name: 'Munraj S', first: 'Manta ray', icon: 'svg:manta',pic: '🐢' },

/* ---------------- grapheme words (sound buttons) ---------------- */

      else if (contiguous) { m = el('span', { class: 'mk bar' }); m.style.left = (a.offsetLeft + 2) + 'px'; m.style.width = (b.offsetLeft + b.offsetWidth - a.offsetLeft - 4) + 'px'; }
      else { m = el('span', { class: 'mk arc' }); var l = a.offsetLeft + a.offsetWidth / 2; m.style.left = l + 'px'; m.style.width = (b.offsetLeft + b.offsetWidth / 2 - l) + 'px'; }

window.addEventListener('resize', function () { drawMarks(app); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawMarks(app); });

/* ---------------- state ---------------- */
var S = null;
var sbBtn = document.getElementById('sbBtn');
sbBtn.onclick = function () {
  var on = !document.body.classList.contains('sb');
  document.body.classList.toggle('sb', on); sbBtn.classList.toggle('on', on);
  if (S) { sset('sb:' + S.learner.name, on); if (on) S.sbUsed = true; }
  drawMarks(app);
};
function setHeader() {
  var who = document.getElementById('who'); who.innerHTML = ''; if (S) { who.appendChild(iconNode(S.learner, 'ic')); who.appendChild(document.createTextNode(S.learner.first)); }
  document.getElementById('whoBox').style.display = S ? 'flex' : 'none';
  sbBtn.style.display = S ? 'inline-block' : 'none';
  var dots = document.getElementById('dots'); dots.innerHTML = '';
  if (S && S.items) S.items.forEach(function (x, i) { dots.appendChild(el('span', { class: i < S.si ? 'done' : (i === S.si ? 'now' : '') })); });
}
function listFor(l) { return l.sound ? MAH_PASSAGES : PASSAGES; }

/* ---------------- names ---------------- */
function home() {
  S = null; setHeader(); document.body.classList.remove('sb'); sbBtn.classList.remove('on');
  screen(el('div', { class: 'card center' }, el('h2', { text: 'Tap your picture' }),
    el('div', { class: 'grid' }, LEARNERS.map(function (l) { return el('button', { class: 'nameTile', type: 'button', onclick: function () { enter(l); } }, iconNode(l, 'ic'), l.first); }))));
}
// pick up where the learner left off on this iPad today (after a lock or reload), otherwise today's text
function enter(l) {
  var r = sget('resume:' + l.name, null);
  if (r && r.date === todayStr() && listFor(l)[r.idx]) begin(l, r.idx, r.set, r); else begin(l, todaysIndex(l));

  // no passage for today (weekend or a later date): the latest one dated before today
  var best = 0;

/* ---------------- reading a passage ---------------- */

  S.sbUsed = document.body.classList.contains('sb');

    el('div', { class: 'title', text: P.title }),
    el('div', { class: 'passage' }, el('div', { class: 'txt' }, !whole && S.si ? prev : null, cur), !whole && it.pic ? el('div', { class: 'pic', text: it.pic }) : null));

    fb.appendChild(el('div', { class: 'feedback ' + (ok ? 'ok' : 'no') }, ok ? '✅ Yes! Well done.' : '👀 The green answer is right.', !ok && why ? el('div', { text: why }) : null));

      w.node.onclick = function () {

    fb.appendChild(nb);

  }

      b.onclick = function () {
        if (answered) return;
        var ok = o === correct; answerText = o;
        Array.prototype.forEach.call(box.children, function (x) { x.disabled = true; if (x.textContent === correct) x.classList.add('ok'); });
        if (!ok) b.classList.add('no');

function openAdults() {
  document.getElementById('aQueue').textContent = 'Answers waiting to send on this iPad: ' + outbox().length;
  var sel = document.getElementById('aPass'); sel.innerHTML = '';
  sel.appendChild(el('option', { value: '' }, 'Automatic (by date)'));
  PASSAGES.forEach(function (p, i) { sel.appendChild(el('option', { value: String(i) }, (i + 1) + '. ' + p.title + ' (' + p.date.slice(8) + '/' + p.date.slice(5, 7) + ')')); });
  var ov = sget('override', null); sel.value = ov && ov.date === todayStr() ? String(ov.i) : '';
  adults.classList.add('open');
}
title.addEventListener('touchstart', function () { holdT = setTimeout(openAdults, 1200); }, { passive: true });
title.addEventListener('touchend', function () { clearTimeout(holdT); });

};
