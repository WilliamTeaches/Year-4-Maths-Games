:root {
  --magenta: #b0126f; --magenta-dark: #8a0d57; --magenta-soft: #fbe6f1;
  --ink: #1f2430; --muted: #646b78; --line: #e7e1ea; --bg: #faf7fb; --card: #ffffff;
  --ok: #23874b; --ok-soft: #dcf3e5; --warn: #c9610f; --warn-soft: #fde8d5;
  --who: #f6a75c; --who-d: #dd6e2c; --who-soft: #fdecdd; --doing: #ffd84d; --doing-d: #e3c000; --doing-soft: #fef8d2; --stop: #e9e6ec;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: "Sassoon Primary", "Comic Sans MS", system-ui, sans-serif;
  font-size: 22px; line-height: 1.35; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
header { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px; padding: 10px 18px;
  background: var(--magenta); color: #fff; }
header h1 { font-size: 24px; margin: 0; font-weight: 400; white-space: nowrap; }
#who { display: none; align-items: center; gap: 8px; background: #fff; color: var(--ink); border-radius: 999px; padding: 3px 14px 3px 8px; font-size: 20px; white-space: nowrap; }
#who .ic { font-size: 26px; line-height: 1; display: inline-flex; }
#crumb { font-size: 18px; opacity: .95; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#dots { margin-left: auto; display: flex; gap: 6px; align-items: center; }
#dots span { font-size: 15px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.22); white-space: nowrap; }
#dots span.now { background: #fff; color: var(--magenta-dark); }
#dots span.done { background: rgba(255,255,255,.5); color: var(--magenta-dark); }
#adultBtn { border: 2px solid rgba(255,255,255,.7); background: transparent; color: #fff; border-radius: 999px; padding: 3px 14px; font-size: 17px; }
main { max-width: 1040px; margin: 0 auto; padding: 16px 18px 40px; }
.adult { background: var(--magenta-soft); border: 2px solid #f0c3dc; border-radius: 16px; padding: 12px 16px; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  font-size: 18px; line-height: 1.4; color: var(--ink); margin-bottom: 16px; }
.adult b { color: var(--magenta-dark); }
.adult .tag { display: inline-block; background: var(--magenta); color: #fff; border-radius: 999px; padding: 1px 12px; font-size: 15px; margin-right: 8px; }
.stagecard { background: var(--card); border: 2px solid var(--line); border-radius: 22px; padding: 22px; min-height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; text-align: center; }
.btnrow { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }
.btn { border: 0; border-radius: 16px; padding: 14px 26px; font-size: 24px; min-height: 60px; background: var(--magenta); color: #fff; box-shadow: 0 4px 0 var(--magenta-dark); }
.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 var(--magenta-dark); }
.btn.ok { background: var(--ok); box-shadow: 0 4px 0 #17603a; }
.btn.warn { background: var(--warn); box-shadow: 0 4px 0 #8f4409; }
.btn.plain { background: #fff; color: var(--ink); border: 2px solid var(--line); box-shadow: 0 4px 0 var(--line); }
.btn[disabled] { opacity: .35; }
.sys { font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; }
/* home */
.grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.pick { background: #fff; border: 3px solid var(--line); border-radius: 22px; padding: 16px 8px 12px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 24px; min-height: 150px; position: relative; }
.pick .ic { font-size: 72px; line-height: 1.05; display: inline-flex; }
.pick.done { border-color: var(--ok); background: var(--ok-soft); }
.pick.done::after { content: "\2713"; position: absolute; top: 8px; right: 14px; color: var(--ok); font-size: 30px; font-family: system-ui, sans-serif; }
.today { font-size: 26px; margin: 4px 0 14px; }
/* key */
.key { display: flex; align-items: center; gap: 16px; background: var(--who); border-radius: 18px; padding: 14px 24px; }
.key img { height: 74px; }
.key .w { font-size: 44px; }
.key .pill { background: #fff; border-radius: 999px; padding: 4px 22px; font-size: 36px; }
.ican { font-size: 28px; max-width: 760px; }
/* say */
.sayline { font-size: 40px; max-width: 860px; }
.small { font-size: 20px; color: var(--muted); }
.count { font-family: system-ui, sans-serif; font-size: 16px; color: var(--muted); }
/* frame and cards */
.framewrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; justify-content: center; }
.scene { font-size: 84px; line-height: 1; background: #fff; border: 2px solid var(--line); border-radius: 18px; padding: 12px 16px; white-space: nowrap; }
.frame { display: flex; gap: 10px; align-items: flex-end; }
.slotcol { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.slotlab { font-size: 18px; }
.slot { border-radius: 16px; border: 4px solid; min-height: 104px; display: flex; align-items: center; justify-content: center; padding: 8px; }
.slot.who { background: var(--who-soft); border-color: var(--who-d); min-width: 300px; }
.slot.doing { background: var(--doing-soft); border-color: var(--doing-d); min-width: 220px; }
.slot.stop { background: #f2f2f2; border-color: var(--ink); min-width: 60px; align-items: flex-end; padding-bottom: 20px; }
.slot.stop i { width: 18px; height: 18px; border-radius: 50%; background: var(--ink); display: block; }
.cardx { border: 0; border-radius: 12px; display: flex; align-items: center; gap: 12px; padding: 10px 18px 10px 10px; font-size: 34px; min-height: 80px; color: var(--ink); box-shadow: 0 4px 0 rgba(0,0,0,.18); animation: drop .35s ease both; white-space: nowrap; }
.cardx.who { background: var(--who); }
.cardx.doing { background: var(--doing); }
.cardx .pw { background: #fff; border-radius: 10px; width: 62px; height: 62px; display: flex; align-items: center; justify-content: center; font-size: 42px; line-height: 1; }
.cardx img { height: 50px; margin-left: 6px; }
.cardx.right { outline: 6px solid var(--ok); outline-offset: 3px; }
.tray { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
.tray .cardx { font-size: 28px; min-height: 66px; animation: none; }
.tray .cardx .pw { width: 50px; height: 50px; font-size: 34px; }
.tray .cardx.used { opacity: .3; }
@keyframes drop { from { opacity: 0; transform: translateY(-18px); } to { opacity: 1; transform: none; } }
.shake { animation: shake .4s; }
@keyframes shake { 20%, 60% { transform: translateX(-9px); } 40%, 80% { transform: translateX(9px); } }
/* tap the subject */
.sentrow { display: flex; align-items: center; gap: 18px; justify-content: center; flex-wrap: wrap; }
.sentpic { font-size: 76px; line-height: 1; white-space: nowrap; }
.sent { font-size: 50px; line-height: 1.5; max-width: 900px; }
.sent .wd { display: inline-block; padding: 0 9px; margin: 3px 1px; border-radius: 12px; border: 3px solid transparent; }
.sent .wd.sub { background: var(--who); margin: 3px 0; padding: 0 10px; border-radius: 0; }
.sent .wd.sub.s0 { border-radius: 12px 0 0 12px; } .sent .wd.sub.s1 { border-radius: 0 12px 12px 0; } .sent .wd.sub.s0.s1 { border-radius: 12px; }
.sent .wd.chosen { border-color: var(--ink); }
.fb { font-size: 30px; min-height: 42px; }
.fb.ok { color: var(--ok); }
.instr { display: flex; align-items: center; gap: 12px; font-size: 26px; }
.instr .tile { background: var(--who); border-radius: 10px; padding: 5px 9px; display: inline-flex; }
.instr .tile img { height: 34px; }
/* results */
.res { text-align: left; font-size: 28px; display: flex; flex-direction: column; gap: 6px; }
.res .mk { display: inline-block; width: 34px; font-family: system-ui, sans-serif; }
.res .mk.y { color: var(--ok); } .res .mk.n { color: var(--warn); }
.res .wd.sub { background: var(--who); border-radius: 8px; display: inline-block; line-height: 1; padding: 0 8px 9px; vertical-align: baseline; margin-bottom: -9px; }
.res > div { padding: 7px 0; }
.sum { text-align: left; width: 100%; max-width: 780px; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 20px; line-height: 1.45; }
.sum h2 { font-size: 24px; margin: 0 0 8px; display: flex; align-items: center; gap: 10px; font-weight: 600; }
.sum h2 .ic { font-size: 34px; display: inline-flex; }
.sum table { border-collapse: collapse; width: 100%; }
.sum td { border-top: 1px solid var(--line); padding: 7px 8px; vertical-align: top; }
.sum td:first-child { width: 150px; color: var(--muted); }
.sum .big { font-size: 22px; font-weight: 600; }
.sum .write { margin-top: 12px; background: var(--ok-soft); border: 2px solid #b5e0c5; border-radius: 12px; padding: 10px 14px; }
.sum .write.rep { background: var(--warn-soft); border-color: #f3c9a3; }
.sum ul { margin: 2px 0 0 18px; padding: 0; }
.q { font-size: 26px; display: flex; align-items: center; gap: 14px; justify-content: center; flex-wrap: wrap; }
.q .btn { font-size: 20px; min-height: 48px; padding: 8px 20px; }
.q .btn.sel { outline: 5px solid var(--ink); outline-offset: 2px; }
/* adults panel */
#adults { display: none; position: fixed; inset: 0; background: rgba(31,36,48,.55); z-index: 50; align-items: center; justify-content: center; padding: 16px; }
#adults.open { display: flex; }
#adults .card { background: #fff; border-radius: 18px; padding: 20px 22px; max-width: 760px; width: 100%; max-height: 92vh; overflow: auto; font-family: system-ui, -apple-system, "Segoe UI", Arial, sans-serif; font-size: 18px; }
#adults h2 { margin: 0 0 8px; font-size: 24px; }
#adults select, #adults button { font-size: 18px; padding: 8px 12px; border-radius: 10px; border: 2px solid var(--line); background: #fff; margin: 4px 6px 4px 0; }
#adults .log { border-top: 1px solid var(--line); padding: 8px 0; }
@media (max-width: 800px) {
  .sent { font-size: 40px; } .sayline { font-size: 32px; } .cardx { font-size: 28px; } .slot.who { min-width: 240px; } .slot.doing { min-width: 180px; }
  #dots span { display: none; } #dots span.now { display: inline; } .scene { font-size: 64px; } .pick .ic { font-size: 60px; }
}
</style>
</head>
<body>
<header>
  <h1 id="title">Step session</h1>
  <span id="who"></span>
  <span id="crumb"></span>
  <div id="dots"></div>
  <button id="adultBtn" type="button">Adults</button>
</header>
<main id="app"></main>
<div id="adults"><div class="card" id="adultCard"></div></div>

  h += '<p>Session: <select id="aDay"><option value="">Automatic (today)</option>' + DAY_KEYS.map(function (k) { return '<option value="' + k + '"' + (OV.day === k ? ' selected' : '') + '>' + STEPS[1].days[k].label + (k === 'practise' ? ' (spare session)' : '') + '</option>'; }).join('') + '</select> ' +
    'Step: <select id="aStep"><option value="0">Automatic</option>' + Object.keys(STEPS).map(function (k) { return '<option value="' + k + '"' + (OV.step === +k ? ' selected' : '') + '>Step ' + k + '</option>'; }).join('') + '</select></p>';
  h += '<h2>Today’s summaries on this iPad</h2>';
  h += LOG.length ? LOG.map(function (r) { return '<div class="log sum"><b>' + esc(r.name) + ' · ' + r.when + ' · Step ' + r.step + ' · ' + r.label + '</b>' + r.html + '</div>'; }).join('') : '<p>None yet.</p>';
  h += '<p><button id="aClose" type="button">Close</button> <button id="aHome" type="button">Back to the pictures</button> <button id="aClear" type="button">Clear today’s summaries</button></p>';
  h += '<p style="color:#646b78;font-size:15px">Nothing is sent anywhere from this page and no names are used. Summaries stay on this iPad for today only.</p>';
  card.innerHTML = h; adults.classList.add('open');
  document.getElementById('aDay').onchange = function () { OV.day = this.value; };
  document.getElementById('aStep').onchange = function () { OV.step = +this.value; };
  document.getElementById('aClose').onclick = function () { adults.classList.remove('open'); if (!S) home(); };
  document.getElementById('aHome').onclick = function () { adults.classList.remove('open'); home(); };
  document.getElementById('aClear').onclick = function () { LOG = []; saveLog(); openAdults(); };
}
document.getElementById('adultBtn').onclick = openAdults;
home();
})();
</script>
