:root{color-scheme:light dark;
  --m:#A3125E;--m2:#7d0d48;--soft:#F6E3EC;--line:#ead1de;--ink:#1a1a1a;--ink2:#555;--bg:#fbf4f7;--card:#fff;--ok:#2e8b57;--bar:#fff;--shadow:0 2px 10px rgba(163,18,94,.08);
  --who:#F28C28;--doing:#F2C930;--what:#4CAF50;--desc:#9B59D0;--join:#9E9E9E;--why:#6B7280;
  --who-bg:#FFD9B3;--doing-bg:#FFF0A6;--what-bg:#C8ECC9;--desc-bg:#E2CFF5;--join-bg:#DCDCDC;--why-bg:#EEF0F3;
  --cc-ink:#1a1a1a}
:root[data-theme="dark"]{--m:#E0569A;--m2:#F27DB6;--soft:#3a1f2d;--line:#4a2a3a;--ink:#f3e9ee;--ink2:#cdb9c4;--bg:#1b1418;--card:#261b21;--bar:#1f161b;--shadow:0 2px 10px rgba(0,0,0,.4);
  --who-bg:#5a3310;--doing-bg:#5a4a08;--what-bg:#1f4a22;--desc-bg:#3f2a5a;--join-bg:#3a3a3a;--why-bg:#2b2f36;--cc-ink:#f3e9ee}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--m:#E0569A;--m2:#F27DB6;--soft:#3a1f2d;--line:#4a2a3a;--ink:#f3e9ee;--ink2:#cdb9c4;--bg:#1b1418;--card:#261b21;--bar:#1f161b;--shadow:0 2px 10px rgba(0,0,0,.4);
  --who-bg:#5a3310;--doing-bg:#5a4a08;--what-bg:#1f4a22;--desc-bg:#3f2a5a;--join-bg:#3a3a3a;--why-bg:#2b2f36;--cc-ink:#f3e9ee}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Sassoon Primary","Comic Sans MS",system-ui,sans-serif;-webkit-text-size-adjust:100%}
button{font-family:inherit;touch-action:manipulation}
header{background:#A3125E;color:#fff;display:flex;align-items:center;gap:10px;padding:10px 14px;position:sticky;top:0;z-index:5;padding-top:calc(10px + env(safe-area-inset-top))}
header h1{margin:0;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;cursor:default;font-size:21px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .who{font-size:16px;opacity:.95;white-space:nowrap}
.hb{border:0;background:rgba(255,255,255,.18);color:#fff;border-radius:999px;min-width:44px;height:40px;padding:0 12px;font:inherit;font-size:17px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px}
.hb.on{background:#fff;color:#A3125E}
.dots{display:flex;gap:6px;margin-left:4px}.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.35)}.dots i.on{background:#fff}
main{max-width:980px;margin:0 auto;padding:16px 16px 130px}
.card{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
h2{margin:0 0 4px;font-size:27px;color:var(--m);display:flex;align-items:center;gap:10px;line-height:1.2}
.sub{margin:0 0 14px;font-size:18px;color:var(--ink2)}
.say{border:0;background:var(--soft);color:var(--m);border-radius:50%;width:44px;height:44px;font-size:22px;cursor:pointer;flex:none}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,1fr)}.g4{grid-template-columns:repeat(4,1fr)}
.gst{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
@media (max-width:700px){.g4{grid-template-columns:repeat(3,1fr)}.gst{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}}
.tile{border:3px solid var(--line);background:var(--card);border-radius:16px;padding:14px 10px;font:inherit;font-size:20px;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;min-height:64px;justify-content:center;text-align:center;color:var(--ink)}
.tile.sel{border-color:var(--m);background:var(--soft);color:var(--m)}
.tile .sic{width:74px;height:74px;object-fit:contain;display:block;margin-bottom:4px;background:#fff;border-radius:16px;padding:7px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
@media (max-width:1000px){#readB span{display:none}}
.tile .ic{font-size:40px;line-height:1.15;display:block}
.cls{padding:0;overflow:hidden;min-height:220px;justify-content:flex-end;gap:0;position:relative}
.cls img{width:100%;height:170px;object-fit:cover;display:block}
.cls .ph{width:100%;height:170px;display:flex;align-items:center;justify-content:center;font-size:70px;background:linear-gradient(135deg,#cfe8c8,#9fd0b8)}
.cls span.lab{display:block;width:100%;padding:12px 10px;font-size:26px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{border:3px solid var(--line);background:var(--card);border-radius:999px;padding:12px 18px;font:inherit;font-size:19px;font-weight:700;cursor:pointer;color:var(--ink);text-align:left;line-height:1.25}
.chip.sel{border-color:var(--m);background:var(--m);color:#fff}
.chip.other{border-style:dashed}
.step{font-size:18px;font-weight:700;color:var(--m);margin:18px 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sublab{font-size:16px;color:var(--ink2);margin:8px 0 8px}
input[type=text],textarea{width:100%;font:inherit;font-size:20px;border:3px solid var(--line);border-radius:14px;padding:12px;background:var(--card);color:var(--ink)}
textarea{min-height:70px;resize:vertical}
input:focus,textarea:focus{outline:none;border-color:var(--m)}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--bar);border-top:2px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;gap:12px;justify-content:center;align-items:center;z-index:5;flex-wrap:wrap}
.bar .hint{width:100%;text-align:center;font-size:15px;color:var(--ink2);margin:-2px 0 4px;min-height:18px}
.btn{border:0;border-radius:14px;padding:16px 26px;font:inherit;font-size:22px;font-weight:700;cursor:pointer}
.back{background:var(--soft);color:var(--m)}
.next{background:#A3125E;color:#fff;min-width:220px}
.next:disabled{opacity:.35;cursor:default}
.sum{display:grid;gap:12px}
.sum .row{border:2px solid var(--line);border-radius:14px;padding:12px 14px;font-size:20px;line-height:1.7}
.sum .row b{color:var(--m);display:block;font-size:16px;margin-bottom:4px}
.sum .edit{float:right;border:0;background:var(--soft);color:var(--m);border-radius:10px;padding:6px 12px;font:inherit;font-weight:700;cursor:pointer;margin-left:8px}
.cc{padding:3px 8px;border-radius:8px;font-weight:700;color:var(--cc-ink);box-decoration-break:clone;-webkit-box-decoration-break:clone}
.cc-who{background:var(--who-bg)}
.cc-doing{background:var(--doing-bg)}
.cc-what{background:var(--what-bg)}
.cc-desc{background:var(--desc-bg)}
.cc-join{background:var(--join-bg)}
.cc-why{background:var(--why-bg);font-weight:400}
.key{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 14px;font-size:15px;align-items:center}
.key .cc{font-weight:700}
.badge{display:inline-block;line-height:1.4;font-size:14px;font-weight:700;padding:2px 10px;border-radius:999px;color:#1a1a1a;text-transform:lowercase}
.b-what{background:var(--what)}.b-desc{background:var(--desc);color:#fff}.b-join{background:var(--join)}.b-who{background:var(--who)}.b-doing{background:var(--doing)}
.done{text-align:center;padding:30px 10px}.done .ic{font-size:90px}
.note{font-size:14px;color:var(--ink2);margin-top:10px}
.demo{background:#fff6d6;border:2px dashed #d9b400;border-radius:12px;padding:10px;font-size:14px;text-align:left;white-space:pre-wrap;margin-top:16px;color:#1a1a1a}
.skills{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:560px){.skills{grid-template-columns:1fr}}
.skill{display:flex;align-items:center;gap:10px;border:3px solid var(--line);background:var(--card);border-radius:16px;padding:8px;font:inherit;text-align:left;cursor:pointer;color:var(--ink)}
.skill img{width:64px;height:64px;border-radius:10px;flex:none;object-fit:cover}
.skill span{font-size:18px;line-height:1.25}.skill b{display:block;font-size:15px;color:var(--m)}
.skill.sel{border-color:var(--m);background:var(--soft)}
.adultlink{display:block;text-align:center;margin-top:8px;color:var(--ink2);font-size:14px;background:none;border:0;width:100%;cursor:pointer;text-decoration:underline}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:center;justify-content:center;padding:16px}
.dlg{background:var(--card);color:var(--ink);border-radius:18px;padding:20px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
.dlg h3{margin:0 0 10px;color:var(--m);font-size:24px}
.dlg p{font-size:16px;line-height:1.45;margin:8px 0}
.dlg .row2{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
.dlg .btn{font-size:17px;padding:12px 16px}
.dlg .small{font-size:14px;color:var(--ink2)}
.pill{display:inline-block;background:var(--soft);color:var(--m);border-radius:999px;padding:3px 10px;font-weight:700;font-size:14px}
.sr{position:absolute;left:-9999px}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.tile,.chip,.skill{transition:transform .08s}.tile:active,.chip:active,.skill:active{transform:scale(.97)}}
.chip .ci{font-size:26px;line-height:1;vertical-align:-4px;margin-right:2px}
code{font-family:ui-monospace,Menlo,monospace;font-size:13px;background:var(--soft);padding:1px 5px;border-radius:5px}
.preview{border:2px dashed var(--line);border-radius:14px;padding:12px 14px;font-size:21px;line-height:1.75;background:var(--bg)}
</style>

<body>
<header>
  <h1>🗣️ Year 3 Pupil Voice</h1>
  <span class="who" id="who"></span>
  <div class="dots" id="dots"></div>
  <button class="hb" id="readB" aria-pressed="false" title="Read to me">🔊 <span>Read to me</span></button>
  <button class="hb" id="themeB" aria-label="Switch light or dark mode">🌙</button>
</header>
<main id="app"></main>
<div class="bar" id="bar"><div class="hint" id="hint"></div><button class="btn back" id="back">← Back</button><button class="btn next" id="next">Next →</button></div>
<script>//---------------------------------------------------------------------

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }

     ["😳|singing in front of others is hard","🧠|remembering the words is hard","🎵|singing in tune is hard"],
     ["🦁|I want to sing with confidence","🎵|I want to sing in tune","🧠|I want to know all the words"])
  ]},
 {n:"Geographer",taught:false,parts:[],why:{fav:[],tricky:[],better:[]}},
 {n:"Historian",taught:false,parts:[],why:{fav:[],tricky:[],better:[]}},
 {n:"Designer",taught:false,parts:[],why:{fav:[],tricky:[],better:[]}}
];
/* The four WFA learning skills (pictures come from the skill cards). Each reason also follows "because". */
var SKILLS = [
 {n:"Collaboration",fav:"I worked well with others",tricky:"working with a partner or a group is hard",better:"I want to work better with others"},
 {n:"Curiosity and Imagination",fav:"I got to ask questions and use my imagination",tricky:"it's hard to come up with my own ideas",better:"I want to explore my own ideas"},
 {n:"Independence",fav:"I could do it on my own",tricky:"it's hard to do it without help",better:"I want to do it by myself"},
 {n:"Resilience",fav:"I kept going even when it was hard",tricky:"it's hard to keep going when I'm stuck",better:"I want to keep going and not give up"}
];
/* The three questions. Each sentence is built from colour coded parts:
   who (orange), doing (yellow), what (green), describe (purple), joining word (grey), then the reason. */
var QS = [
 {key:"fav",icon:"⭐",title:"My favourite state of being",ask:"Which state of being has been your favourite so far in Year 3?",aspect:"Which part did you enjoy most?",why:"Why? Choose one or two reasons, and a learning skill if you like.",
  parts:function(st,part){return [["who","My favourite state of being"],["doing","has been"],["what","being "+st],["desc","especially "+part]]}},
 {key:"tricky",icon:"🧗",title:"The state of being I have found most challenging",ask:"Which state of being have you found most challenging?",aspect:"Which part has been challenging?",why:"Why has it been challenging? Choose one or two reasons, and a learning skill if you like.",
  parts:function(st,part){return [["who","The state of being I have found most challenging"],["doing","is"],["what","being "+st],["desc","especially "+part]]}},
 {key:"better",icon:"🎯",title:"The state of being I would like to get better at",ask:"Which state of being would you like to get better at?",aspect:"Which part do you want to get better at?",why:"Why? Choose one or two reasons, and a learning skill if you like.",
  parts:function(st,part){return [["who","The state of being I would like to get better at"],["doing","is"],["what","being "+st],["desc","especially "+part]]}}
];
/* Class pictures: PAINT["Perretts"] is set by the build. Add PAINT["Stoke"] when the Stoke painting is available. */
var CLASSES = {
  "Perretts":["Abdoul","Ada","Arabella","Bea","Cassie","Charlie","Grace","Iris","Isabelle","Isla","Jacob","Kalani","Kanae","Laci","Leandra","Leo","Lewis","Loveleen","Mahsa","Matilda","Munraj","Nadith","Reuben","Rocco","Rosie","Sharmada","Sonny","Sophia","Thea","Xander","Yusuf"],
  "Stoke":["Abu","Amelia","Bluebelle","Callie","Celine","Cerys","Elias","Erin","Eva H","Eva P-C","Evie","Freddie","Gaby","Grace","Isabelle","Jensen","Jessica","Lena","Leo","Leona","Lilya","Maisy","Mohammed","Ottilie","Samuel","Savanna","Sebbie","Sofiia","Tanvee","Theon","Willow"]
};
/* ============ Google Form (set up the same way as Sentence Builders) ============
   Leave FORM as null for demo mode: nothing is sent and the Thank you screen shows what would be sent.
   Then replace null with the id and entry numbers from the form's pre-filled link, for example:
   var FORM = {"id":"1FAIpQL...","entries":{"klass":"123","name":"456","fav":"789","tricky":"012","better":"345"}}; */
var FORM = {"id":"1FAIpQLSeK7jv5k57U3xDenjZ9Fkeh04NL8YpmBXercOdGEUCjlmfGNA","entries":{"klass":"1946711780","name":"1177702195","fav":"1798407227","tricky":"1649342843","better":"1767522496"}};
var OUTBOX = 'y3-pupil-voice-outbox';
var DRAFT = 'y3-pupil-voice-draft';
var THEME = 'y3-pupil-voice-theme';
var READ = 'y3-pupil-voice-read';

</script>
<script>
/* ============ APP ============ */
var STEPS=["class","name","fav","tricky","better","check","done","saved"];
var AN=["Author","Artist","Athlete"];
function art(st){return (AN.indexOf(st)>=0?"an ":"a ")+st}
function blank(){return {step:0,klass:"",name:"",ans:{fav:{},tricky:{},better:{}}}}
var s=blank();
var app=document.getElementById('app'),bar=document.getElementById('bar'),nextB=document.getElementById('next'),backB=document.getElementById('back'),hint=document.getElementById('hint');
var lastScreen=null, doneTimer=null;

/* ---------- theme (light / dark) ---------- */
function getTheme(){try{return localStorage.getItem(THEME)||'auto'}catch(e){return 'auto'}}
function applyTheme(){var t=getTheme();if(t==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.setAttribute('data-theme',t);
  var dark=t==='dark'||(t==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches);
  var b=document.getElementById('themeB');b.textContent=dark?'☀️':'🌙';b.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');
  var meta=document.querySelector('meta[name=theme-color]');if(meta)meta.setAttribute('content','#A3125E')}
function cycleTheme(){var t=getTheme();var sys=window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;
  var dark=t==='dark'||(t==='auto'&&sys);var next=dark?'light':'dark';if((next==='dark')===sys)next='auto';
  try{localStorage.setItem(THEME,next)}catch(e){}applyTheme()}
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme)}catch(e){try{window.matchMedia('(prefers-color-scheme: dark)').addListener(applyTheme)}catch(e2){}}}

/* ---------- speech ---------- */
var readOn=false;try{readOn=localStorage.getItem(READ)==='1'}catch(e){}
var voice=null;
function pickVoice(){if(!window.speechSynthesis)return;var vs=speechSynthesis.getVoices();if(!vs.length)return;
  voice=null;for(var i=0;i<vs.length;i++){if(/en[-_]GB/i.test(vs[i].lang)&&/Daniel|Kate|Serena|Google UK English Female|Google UK English Male|Martha|Arthur/i.test(vs[i].name)){voice=vs[i];break}}
  if(!voice)for(var j=0;j<vs.length;j++){if(/en[-_]GB/i.test(vs[j].lang)){voice=vs[j];break}}}
if(window.speechSynthesis){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(t){if(!window.speechSynthesis||!t)return;try{speechSynthesis.cancel();var u=new SpeechSynthesisUtterance(String(t).replace(/[|]/g,' '));u.lang='en-GB';if(voice)u.voice=voice;u.rate=0.95;speechSynthesis.speak(u)}catch(e){}}
function maybeSpeak(t){if(readOn)speak(t)}
function toggleRead(){readOn=!readOn;try{localStorage.setItem(READ,readOn?'1':'0')}catch(e){}
  var b=document.getElementById('readB');b.className='hb'+(readOn?' on':'');b.setAttribute('aria-pressed',readOn?'true':'false');
  if(readOn){speak('Read to me is on. I will read each question and anything you tap.')}else{try{speechSynthesis.cancel()}catch(e){}}}
document.addEventListener('pointerdown',function warm(){try{if(window.speechSynthesis){var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u)}}catch(e){}document.removeEventListener('pointerdown',warm)},{once:true});

/* ---------- helpers ---------- */
function esc(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function attr(v){return JSON.stringify(v).replace(/"/g,'&quot;')}
function ico(v){var i=v.indexOf('|');return i>=0?v.slice(0,i):''}
function txt(v){var i=v.indexOf('|');return i>=0?v.slice(i+1):v}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function sayBtn(t){return '<button class="say" aria-label="Read aloud" onclick="speak('+attr(t)+')">🔊</button>'}
function badge(c,t){return '<span class="badge b-'+c+'">'+t+'</span>'}
function qOf(k){for(var i=0;i<QS.length;i++)if(QS[i].key===k)return QS[i];return null}
function stOf(n){for(var i=0;i<STATES.length;i++)if(STATES[i].n===n)return STATES[i];return null}
function hasOther(a){return (a.aspects||[]).indexOf('__other__')>=0}
function partText(a){var out=[];var as=a.aspects||[];for(var i=0;i<as.length;i++)out.push(as[i]==='__other__'?(a.aspectOther||'').trim():as[i]);return out.join(' and ')}
function partsChosen(S,a){var out=[];var as=a.aspects||[];for(var i=0;i<as.length;i++)for(var j=0;j<S.parts.length;j++)if(S.parts[j].t===as[i])out.push(S.parts[j]);return out}
function reasonsFor(S,a,k){var out=[],seen={};var ps=partsChosen(S,a);for(var i=0;i<ps.length;i++){var l=ps[i][k]||[];for(var j=0;j<l.length;j++){var t=txt(l[j]);if(!seen[t]){seen[t]=1;out.push(l[j])}}}
  if(hasOther(a)||!ps.length){var g=S.why[k]||[];for(var m=0;m<g.length;m++){var t2=txt(g[m]);if(!seen[t2]){seen[t2]=1;out.push(g[m])}}}return out}
function partsReady(a){var as=a.aspects||[];return as.length>0&&(!hasOther(a)||(a.aspectOther||'').trim().length>0)}
function skillOf(v){for(var i=0;i<SKILLS.length;i++){var k=SKILLS[i];if(k.fav===v||k.tricky===v||k.better===v)return k.n}return ''}
function reasonsText(k){var a=s.ans[k],r=(a.reasons||[]).slice().sort(function(x,y){return (isSkill(x)?1:0)-(isSkill(y)?1:0)}),out=[];for(var i=0;i<r.length;i++){var t=txt(r[i]);var sk=skillOf(r[i]);out.push(t+(sk?' ('+sk+')':''))}
  if(out.length<=2)return out.join(' and ');return out.slice(0,-1).join(', ')+' and '+out[out.length-1]}
function sentenceParts(k){var q=qOf(k),a=s.ans[k];if(!a.state)return [];var p=q.parts(art(a.state),partText(a));p.push(["join","because"]);p.push(["why",reasonsText(k)]);return p}
function sep(p,i){if(i===0)return '';if(i===4)return ', ';if(/^especially/.test(p[i][1]))return ', ';return ' '}
function sentence(k){var p=sentenceParts(k),out='';for(var i=0;i<p.length;i++)out+=sep(p,i)+p[i][1];out+='.';
  var own=(s.ans[k].own||'').trim();if(own)out+=' '+cap(own)+(/[.!?]$/.test(own)?'':'.');return out}
function sentenceHTML(k){var p=sentenceParts(k),h=[];for(var i=0;i<p.length;i++){h.push(sep(p,i)+'<span class="cc cc-'+p[i][0]+'">'+esc(p[i][1])+'</span>')}
  var own=(s.ans[k].own||'').trim();return h.join('')+'.'+(own?' '+esc(cap(own))+(/[.!?]$/.test(own)?'':'.'):'')}
function complete(k){var a=s.ans[k];return !!(a.state&&partsReady(a)&&(a.reasons||[]).length)}
function saveDraft(){try{sessionStorage.setItem(DRAFT,JSON.stringify(s))}catch(e){}}
function clearDraft(){try{sessionStorage.removeItem(DRAFT)}catch(e){}}

/* ---------- render ---------- */
function setHint(t){hint.textContent=t||''}
function render(force){
  var st=STEPS[s.step];
  document.getElementById('who').textContent=s.name?(s.name+' · '+s.klass):'';
  var d='';for(var i=2;i<=4;i++)d+='<i class="'+(s.step>=i?'on':'')+'"></i>';document.getElementById('dots').innerHTML=d;
  bar.hidden=(st==='done'||st==='saved'); backB.hidden=(s.step===0);
  nextB.textContent = st==='check' ? 'Send my answers ✓' : 'Next →';
  if(doneTimer){clearTimeout(doneTimer);doneTimer=null}
  var same=(lastScreen===st)&&!force;
  if(st==='class'){
    if(!same){var h='<div class="card"><h2>'+sayBtn('Which class are you in?')+'Which class are you in?</h2><div class="grid g2">';
      for(var c in CLASSES){var pic=PAINT[c]?'<img src="'+PAINT[c]+'" alt="">':'<span class="ph">🌳</span>';
        h+='<button class="tile cls" data-v="'+esc(c)+'" onclick="pick(\'klass\','+attr(c)+')">'+pic+'<span class="lab">'+esc(c)+'</span></button>'}
      h+='</div></div>';app.innerHTML=h;maybeSpeak('Which class are you in?')}
    mark('.tile.cls',s.klass);nextB.disabled=!s.klass;setHint(s.klass?'':'Tap your class, then press Next');
  } else if(st==='name'){
    if(!same){var h2='<div class="card"><h2>'+sayBtn('Tap your name.')+'Tap your name</h2><div class="grid g4">';
      var ns=CLASSES[s.klass]||[];for(var n=0;n<ns.length;n++)h2+='<button class="tile nm" data-v="'+esc(ns[n])+'" onclick="pick(\'name\','+attr(ns[n])+')">'+esc(ns[n])+'</button>';
      app.innerHTML=h2+'</div></div>';maybeSpeak('Tap your name.')}
    mark('.tile.nm',s.name);nextB.disabled=!s.name;setHint(s.name?'':'Tap your name, then press Next');
  } else if(st==='fav'||st==='tricky'||st==='better'){
    var q=qOf(st),a=s.ans[st];
    if(!same){var h3='<div class="card"><h2>'+sayBtn(q.ask)+'<span>'+q.icon+' '+q.title+'</span></h2><p class="sub">'+esc(q.ask)+'</p>'+
      '<div class="step">'+badge('what','what')+' Tap a state of being</div><div class="grid gst" id="stgrid">';
      for(var x=0;x<STATES.length;x++){var S=STATES[x];if(!S.taught)continue;
        h3+='<button class="tile stt" data-v="'+esc(S.n)+'" onclick="setA(\''+st+'\',\'state\','+attr(S.n)+')"><img class="sic" src="'+IMG[S.n]+'" alt="">'+esc(S.n)+'</button>'}
      h3+='</div><div id="below"></div></div>';app.innerHTML=h3;maybeSpeak(q.ask)}
    mark('.tile.stt',a.state);renderBelow(st);
    nextB.disabled=!complete(st);
    setHint(!a.state?'Tap a state of being':(!(a.aspects||[]).length?'Now tap which part (one or two)':(!partsReady(a)?'Type the part you mean':(!(a.reasons||[]).length?'Now tap why (one or two reasons)':''))));
  } else if(st==='check'){
    var h4='<div class="card"><h2>'+sayBtn('Check your answers, then press send.')+'Check your answers</h2>'+
      '<div class="key"><span class="cc cc-who">who</span><span class="cc cc-doing">doing</span><span class="cc cc-what">what</span><span class="cc cc-desc">describe</span><span class="cc cc-join">joining word</span><span class="cc cc-why">why</span>'+
      '<button class="say" style="margin-left:auto" aria-label="Read my answers" onclick="readAll()">🔊</button></div><div class="sum">';
    for(var qi=0;qi<QS.length;qi++){var Q=QS[qi];h4+='<div class="row"><button class="edit" onclick="go('+(qi+2)+')">Change</button><b>'+Q.icon+' '+esc(Q.title)+'</b>'+sentenceHTML(Q.key)+'</div>'}
    app.innerHTML=h4+'</div></div>';nextB.disabled=false;setHint('Happy with your answers? Press send');maybeSpeak('Check your answers, then press send.');
  } else if(st==='done'){
    app.innerHTML='<div class="card done"><div class="ic">🌟</div><h2 style="justify-content:center">Thank you, '+esc(s.name)+'!</h2>'+
      '<p class="sub">Your answers have been sent to your teacher.</p>'+
      '<button class="btn next" onclick="reset();go(0)">Next learner →</button><p class="note">This screen goes back to the start by itself after a minute.</p>'+
      (FORM?'':'<div class="demo">Demo mode: nothing was sent. This is what would go to the Google Form:\n\n'+esc(JSON.stringify(payload(),null,2))+'</div>')+'</div>';
    maybeSpeak('Thank you, '+s.name+'. Your answers have been sent.');clearDraft();
    doneTimer=setTimeout(function(){reset();go(0)},60000);
  } else if(st==='saved'){
    app.innerHTML='<div class="card done"><div class="ic">💾</div><h2 style="justify-content:center">Saved on this iPad, '+esc(s.name)+'</h2>'+
      '<p class="sub">This iPad could not send just now. Your answers are saved here and will send by themselves when the internet is back. Show your teacher this screen.</p>'+
      '<div id="qrbox" style="display:flex;justify-content:center;margin:10px 0"></div><p class="note" id="qrmsg"></p>'+
      '<div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap"><button class="btn back" onclick="go(STEPS.indexOf(\'check\'))">Try again</button><button class="btn next" onclick="reset();go(0)">Next learner →</button></div></div>';
    showQR(payload());
  }
  lastScreen=st;saveDraft();
}
function mark(sel,v){var els=app.querySelectorAll(sel);for(var i=0;i<els.length;i++){var on=els[i].getAttribute('data-v')===v;if(on)els[i].classList.add('sel');else els[i].classList.remove('sel')}}
function renderBelow(k){var box=document.getElementById('below');if(!box)return;var q=qOf(k),a=s.ans[k],S=stOf(a.state);
  if(!S){box.innerHTML='';return}
  var as=a.aspects||[];
  var h='<div class="step">'+badge('desc','describe')+' '+sayBtn(q.aspect)+' '+esc(q.aspect)+'</div><div class="sublab">Tap one or two</div><div class="chips">';
  for(var i=0;i<S.parts.length;i++)h+=pchip(k,S.parts[i].t,as,S.parts[i].i,cap(S.parts[i].t));
  h+=pchip(k,'__other__',as,'💬','Something else…','other')+'</div>';
  if(hasOther(a))h+='<div class="sublab">Type the part you mean (a few words):</div><input type="text" id="otherIn" maxlength="80" placeholder="for example our class assembly" value="'+esc(a.aspectOther||'')+'" oninput="otherTyped(\''+k+'\',this.value)">';
  if(partsReady(a)){var r=a.reasons||[];
    h+='<div class="step">'+badge('join','because')+' '+sayBtn(q.why)+' '+esc(q.why)+'</div><div class="sublab">Because of our learning</div><div class="chips">';
    var ws=reasonsFor(S,a,k);for(var j=0;j<ws.length;j++)h+=rchip(k,ws[j],r);
    h+='</div><div class="sublab">Because of my learning skills</div><div class="skills">';
    for(var m=0;m<SKILLS.length;m++){var K=SKILLS[m],v=K[k];h+='<button class="skill'+(r.indexOf(v)>=0?' sel':'')+'" onclick="togR(\''+k+'\','+attr(v)+')"><img src="'+IMG['skill:'+K.n]+'" alt=""><span><b>'+esc(K.n)+'</b>'+esc(v)+'</span></button>'}
    h+='</div>';
    if(r.length)h+='<div class="step">'+sayBtn('Anything else? You can skip this.')+' Anything else? (you can skip this)</div><textarea id="own" placeholder="Type here if you want to…" oninput="s.ans[\''+k+'\'].own=this.value;saveDraft();updatePreview(\''+k+'\')">'+esc(a.own||'')+'</textarea>';
    if(r.length)h+='<div class="step">'+badge('who','who')+badge('doing','doing')+badge('what','what')+badge('desc','describe')+badge('join','joining word')+' Your sentence</div><div class="preview" id="preview"><button class="say" style="float:right;margin-left:8px" aria-label="Read my sentence" onclick="speak(sentence(\''+k+'\'))">🔊</button>'+sentenceHTML(k)+'</div>';
  }
  box.innerHTML=h;
}
function pchip(k,v,as,icon,label,extra){return '<button class="chip'+(as.indexOf(v)>=0?' sel':'')+(extra?' '+extra:'')+'" onclick="togP(\''+k+'\','+attr(v)+')">'+(icon?'<span class="ci">'+icon+'</span> ':'')+esc(label)+'</button>'}
function togP(k,v){var a=s.ans[k];a.aspects=a.aspects||[];var i=a.aspects.indexOf(v);if(i>=0)a.aspects.splice(i,1);else{if(a.aspects.length>=2)a.aspects.shift();a.aspects.push(v);maybeSpeak(v==='__other__'?'Something else. Type the part you mean.':v)}
  a.reasons=[];var y=window.scrollY;render();window.scrollTo(0,y);if(v==='__other__'&&i<0){var inp=document.getElementById('otherIn');if(inp)inp.focus()}}
function chip(k,f,v,cur,icon,label,extra){return '<button class="chip'+(cur===v?' sel':'')+(extra?' '+extra:'')+'" onclick="setA(\''+k+'\',\''+f+'\','+attr(v)+')">'+(icon?'<span class="ci">'+icon+'</span> ':'')+esc(label)+'</button>'}
function rchip(k,v,r){return '<button class="chip'+(r.indexOf(v)>=0?' sel':'')+'" onclick="togR(\''+k+'\','+attr(v)+')">'+(ico(v)?'<span class="ci">'+ico(v)+'</span> ':'')+esc(txt(v))+'</button>'}
function pick(f,v){s[f]=v;if(f==='klass')s.name='';maybeSpeak(v);render()}
function setA(k,f,v){var a=s.ans[k];var y=window.scrollY;a[f]=v;if(f==='state'){a.aspects=[];a.aspectOther='';a.reasons=[];maybeSpeak(v)}
  render();window.scrollTo(0,y);
  if(f==='state'){var b=document.getElementById('below');if(b&&b.firstChild)setTimeout(function(){b.firstChild.scrollIntoView({behavior:'smooth',block:'start'})},50)}}
function otherTyped(k,v){s.ans[k].aspectOther=v;nextB.disabled=!complete(k);setHint(complete(k)?'':(v.trim()?'Now tap why (one or two reasons)':'Type the part you mean'));
  var ready=v.trim().length>0,box=document.getElementById('below');if(ready&&box&&!box.querySelector('.skills')){var y=window.scrollY;renderBelow(k);window.scrollTo(0,y);var i2=document.getElementById('otherIn');if(i2){i2.focus();try{i2.setSelectionRange(v.length,v.length)}catch(e){}}}saveDraft()}
function updatePreview(k){var pv=document.getElementById('preview');if(pv){pv.innerHTML='<button class="say" style="float:right;margin-left:8px" aria-label="Read my sentence" onclick="speak(sentence(\''+k+'\'))">🔊</button>'+sentenceHTML(k)}}
function isSkill(v){return !!skillOf(v)}
function togR(k,v){var a=s.ans[k];a.reasons=a.reasons||[];var i=a.reasons.indexOf(v);
  if(i>=0)a.reasons.splice(i,1);
  else{if(isSkill(v)){a.reasons=a.reasons.filter(function(x){return !isSkill(x)})}else{var others=a.reasons.filter(function(x){return !isSkill(x)});if(others.length>=2)a.reasons.splice(a.reasons.indexOf(others[0]),1)}
    a.reasons.push(v);maybeSpeak(txt(v))}
  var y=window.scrollY;render();window.scrollTo(0,y)}
function readAll(){var t=[];for(var i=0;i<QS.length;i++)t.push(sentence(QS[i].key));speak(t.join(' '))}
function payload(){return {klass:s.klass,name:s.name,fav:sentence('fav'),tricky:sentence('tricky'),better:sentence('better')}}
function reset(){s=blank();lastScreen=null;clearDraft()}

/* ---------- sending ---------- */
function postOne(d){var body=new URLSearchParams();Object.keys(FORM.entries).forEach(function(k){body.append('entry.'+FORM.entries[k],d[k]||'')});
  return fetch('https://docs.google.com/forms/d/e/'+FORM.id+'/formResponse',{method:'POST',mode:'no-cors',body:body})}
function outbox(v){try{if(v){localStorage.setItem(OUTBOX,JSON.stringify(v));return v}return JSON.parse(localStorage.getItem(OUTBOX)||'[]')}catch(e){return []}}
function flushOutbox(){var q=outbox();if(!q.length||!FORM||!navigator.onLine)return;postOne(q[0]).then(function(){var r=outbox();r.shift();outbox(r);flushOutbox()}).catch(function(){})}
function formLink(d){var q=new URLSearchParams();q.append('usp','pp_url');Object.keys(FORM.entries).forEach(function(k){q.append('entry.'+FORM.entries[k],d[k]||'')});
  return 'https://docs.google.com/forms/d/e/'+FORM.id+'/viewform?'+q.toString()}
function qrSvg(text,px){try{qrcode.stringToBytes=qrcode.stringToBytesFuncs['UTF-8'];var q=qrcode(0,'M');q.addData(text);q.make();var svg=q.createSvgTag({cellSize:4,margin:0,scalable:true});return svg.replace('<svg','<svg style="width:'+px+'px;height:'+px+'px;max-width:70vw;max-height:70vw;background:#fff;padding:8px;border-radius:8px"')}catch(e){return ''}}
function showQR(d){var box=document.getElementById('qrbox');if(!box||!FORM)return;box.innerHTML=qrSvg(formLink(d),320);
  document.getElementById('qrmsg').textContent=box.innerHTML?'Teacher: scan this with your phone camera, then tap Submit on the form.':''}
addEventListener('online',flushOutbox);setTimeout(flushOutbox,3000);

/* ---------- adults ---------- */
function adults(){var q=outbox();var here=location.href;var canQR=/^https?:/.test(here);
  var h='<div class="overlay" id="ov" onclick="if(event.target.id===\'ov\')closeAdults()"><div class="dlg" role="dialog" aria-label="Adults">'+
    '<h3>Adults</h3><p class="small">Hidden panel: open it by tapping the title five times or pressing and holding it.</p>'+
    '<p><span class="pill">'+(FORM?'Connected to the Google Form':'Demo mode, not connected to a form yet')+'</span></p>'+
    '<p>Saved answers waiting to send on this iPad: <b id="obn">'+q.length+'</b></p>'+
    '<div class="row2"><button class="btn next" onclick="flushNow()" '+(q.length&&FORM?'':'disabled')+'>Send saved answers now</button>'+
    '<button class="btn back" onclick="if(confirm(\'Delete the saved answers on this iPad?\')){outbox([]);document.getElementById(\'obn\').textContent=0}">Clear saved answers</button></div>'+
    '<div class="row2"><button class="btn back" onclick="reset();closeAdults();go(0)">Start again (new learner)</button></div>'+
    (canQR?'<p><b>QR code for this page</b> (print it or show it on the board):</p><div style="display:flex;justify-content:center">'+qrSvg(here,220)+'</div>':'<p class="small">Open this page from its web address (https) to get a QR code for it here.</p>')+
    '<p class="small">Light or dark mode follows the iPad setting. The ☀️/🌙 button in the header overrides it on this iPad only. 🔊 Read to me reads each question and anything a learner taps.</p>'+
    '<p class="small">To connect the Google Form: open the page file, find <code>var FORM = null;</code> near the bottom and replace it with the form id and entry numbers from the form\'s pre-filled link (same method as Sentence Builders).</p>'+
    '<div class="row2"><button class="btn next" onclick="closeAdults()">Close</button></div></div></div>';
  var w=document.createElement('div');w.innerHTML=h;document.body.appendChild(w.firstChild)}
function closeAdults(){var o=document.getElementById('ov');if(o)o.parentNode.removeChild(o)}
function flushNow(){flushOutbox();setTimeout(function(){var n=document.getElementById('obn');if(n)n.textContent=outbox().length},2500)}

/* ---------- navigation ---------- */
function go(i){s.step=i;render();window.scrollTo(0,0)}
nextB.onclick=function(){
  if(STEPS[s.step]==='check'){
    nextB.disabled=true;nextB.textContent='Sending…';
    if(FORM){var d=payload();var timer=new Promise(function(_,rej){setTimeout(function(){rej(new Error('slow'))},8000)});
      Promise.race([postOne(d),timer]).then(function(){outbox(outbox().filter(function(x){return JSON.stringify(x)!==JSON.stringify(d)}));go(s.step+1)})
        .catch(function(){var q=outbox().filter(function(x){return JSON.stringify(x)!==JSON.stringify(d)});q.push(d);outbox(q);go(STEPS.indexOf('saved'))});
      return}
  }
  go(s.step+1)};
backB.onclick=function(){go(Math.max(0,s.step-1))};
document.getElementById('themeB').onclick=cycleTheme;
/* hidden adults panel: tap the title five times quickly, or press and hold it */
(function(){var t=document.querySelector('header h1'),taps=0,last=0,hold=null;
  t.addEventListener('click',function(){var now=Date.now();taps=(now-last<1200)?taps+1:1;last=now;if(taps>=5){taps=0;if(!document.getElementById('ov'))adults()}});
  t.addEventListener('pointerdown',function(){hold=setTimeout(function(){if(!document.getElementById('ov'))adults()},1500)});
  ['pointerup','pointerleave','pointercancel'].forEach(function(e){t.addEventListener(e,function(){clearTimeout(hold)})});
  t.addEventListener('contextmenu',function(e){e.preventDefault()})})();
document.getElementById('readB').onclick=toggleRead;
document.getElementById('readB').className='hb'+(readOn?' on':'');
applyTheme();
/* restore a draft if the iPad was locked or the page reloaded mid-way */
(function(){try{var d=JSON.parse(sessionStorage.getItem(DRAFT)||'null');if(d&&d.name&&d.step>0&&d.step<STEPS.indexOf('done')){s=d;s.ans=s.ans||{fav:{},tricky:{},better:{}}}}catch(e){}})();
render(true);

</script>
</body>
